# Nova Phase 1b abiogenesis trial (design.md 6.6): one node, a sparks-only
# start, Nova's rules, GPU off, no replicator seeded. The baseline arm.
#
# tools\abio.ps1 runs this config once per (arm, seed): it sets seed, the arm's
# keys (isa.selectors = shuffled, isa.table = nova_v1_plain or nova_v1_inv2),
# run.seconds, run.after_replicator and every output.* path with --set.
# By hand, from the repo root:
#   build-release\bin\nova.exe run configs\abio.cfg --set seed=3 --set run.seconds=60

seed = 1

# --- the node: the bench node of design.md 7.1 I ---
world.model = soup
world.nodes = 1
world.chords = 0
world.soup_size = 65536       # codons
world.millicores = 4000
cpu.instr_per_core = 25000    # 100k instructions a tick for a fully held node

# --- instruction set (the arms change exactly one of these) ---
isa.table = nova_v1           # plain: nova_v1_plain; inv2: nova_v1_inv2
isa.selectors = nearest       # shuffled: a per-seed scrambled numbering

# --- Phase 1b rules (D1, D10) ---
mem.upkeep = 2                # square-cube memory upkeep (mem.upkeep_exp = 4/3, the default)
cpu.wear = 0.001              # D10: held millicores fail back to the pool
spark.timing = last           # D10: chemistry takes only what life left
contact.inject_room = 1       # ... and a host its payload fits in

# --- sparks (D4: grant and lengths are live knobs too) ---
spark.initial = 400
spark.rate = 4
spark.grant = 10
spark.min_len = 8
spark.max_len = 64

# --- detection (D2, extended: design.md 6.6) ---
detect.enabled = true
detect.similarity = 0.75
detect.genebank_threshold = 2
detect.inject = true          # an INJECT that leaves its victim a copy is a link
detect.written = true         # DIVIDE links count only codons the parent wrote
detect.gate_depth = 2         # a copied daughter that made a copy herself...
detect.gate_alive = 2         # ...with at least 2 members alive at once

# --- run ---
run.ticks = 0                 # no tick limit: run.seconds, Esc or the replicator stop it
run.seconds = 0
run.after_replicator = 50000  # keep watching this long after the first detection
run.threads = 1               # one node: more threads cannot help
stats.window = 1000
replay.checkpoint_every = 10000
output.csv = runs/abio/manual/stats.csv
output.replay = runs/abio/manual/replay.log
output.genebank = runs/abio/manual/genebank.txt
output.lineages = runs/abio/manual/lineages.csv
output.profiles = runs/abio/manual/profiles.csv   # behaviour profiles (A3): nova analyse roles
output.result = runs/abio/manual/result.txt
