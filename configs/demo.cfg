# Nova Phase 0 demo world. Run from the repo root:
#   build\bin\nova.exe run configs\demo.cfg --threads 20
#   build\bin\nova.exe replay runs\demo.replay --threads 1
# The printed hash is the same at every thread count.

seed = 42

# --- structural (fixed for the whole run) ---
world.nodes = 256
world.chords = 128            # random long links on top of the ring (attempts)
world.soup_size = 4096        # codons per node
world.pool_capacity = 1000
world.pool_initial = 600
world.outbox_capacity = 2     # parcels per edge per tick

# --- live knobs (may change mid-run; logged as replay events) ---
demo.send_rate = 0.6
demo.sends_per_tick = 4
demo.mutations_per_tick = 16
demo.max_parcel = 200

# --- run and outputs (empty path = off) ---
run.ticks = 2000
run.threads = 0               # 0 = all hardware threads
stats.window = 100
replay.checkpoint_every = 100
output.csv = runs/demo.csv
output.replay = runs/demo.replay
output.snapshot = runs/demo.snap
