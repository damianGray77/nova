# An example search file for `nova search` (docs/analysis-plan.md A1; the
# format is in docs/results/analysis.md). Not a world config: `nova run`
# can't run it. From the repo root:
#
#   build-release\bin\nova.exe search configs\search\example.cfg --dry-run
#   build-release\bin\nova.exe search configs\search\example.cfg
#
# Each trial runs the base config with the trial's settings once per seed, as
# `nova run run.cfg` in runs\search\example\trial_NNN\seed_K (repeat any of
# them from its folder the same way). Stopping the search stops its runs;
# starting it again reuses every run already finished.

# --- what each trial is ---
search.base = configs/world.cfg  # 100 nodes, every feature at its default
search.out = runs/search/example
search.ticks = 50000              # ticks a run
search.seeds = 2                  # runs a trial, with the same seeds for every trial

# --- how many, and how much of the machine ---
search.seed = 1                   # the search's own choices follow from it
search.trials = 60
search.init = 20                  # spread first (a Latin hypercube), then picked by expected improvement
search.parallel = 4               # runs at once (each seed is a run)
search.threads = 4                # threads a run
search.best = 5                   # best_1.cfg .. best_5.cfg

# --- fixed changes to the base (set.<setting> = value) ---
set.stats.window = 1000

# --- what to vary: range.<setting> = lo hi [log | linear], or = registry ---
range.cpu.wear = 0.0002 0.005 log
range.spark.rate = 0.05 1 log
range.mem.upkeep = 0.5 4
range.spark.max_len = 24 96

# --- what a good world is: weights of ln(1 + score), and floors ---
# Scores: lifespan depth genotypes evenness novelty persistence speed.
score.lifespan = 1                # gated lineages' median lifespan
score.novelty = 1                 # successful novelty in the run's second half
floor.genotypes = 10              # diversity: distinct genotypes saved
floor.persistence = 0.9           # population: bodies >= search.body_floor per node in 90% of windows
search.body_floor = 1
