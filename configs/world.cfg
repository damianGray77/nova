# Nova Phase 3 world (design.md 6.9): 100 procedurally generated nodes, every
# property varied over its own noise field, dispersal through DIVIDE, a soup
# with sparks on every node (many origins), Nova's Phase 1b rules, GPU and NPU
# off, no replicator seeded.
#
# A world run is one process on all threads (run.threads = 0). By hand, from
# the repo root:
#   build-release\bin\nova.exe run configs\world.cfg --set seed=3 --set run.seconds=300
# One origin (only node 0 has sparks; the rest wait to be colonised):
#   ... --set world.origins=one
# A seeded founder on one node:
#   ... --set "seed.genome=ZERO ROTB SENSE ALLOC NOP1 COPY DJNZ NOP0 ZERO INC ROTB SENSE DIVIDE" --set seed.node=0

seed = 1

# --- the world (4.1, 4.4a G) ---
world.model = soup
world.graph = procedural
world.nodes = 100
world.links = 4               # proximity links per node (k nearest)
world.ruggedness = 0.2        # fraction of proximity links the ruggedness field cuts
world.long_links = 0.02       # extra long-range links, per node
world.origins = all           # all: a soup with sparks everywhere; one: only node 0
world.dispersal = true        # DIVIDE with BX = neighbour k sends the daughter there

# --- edges (4.4a F) ---
edge.latency_scale = 20       # latency = 1 + floor(hidden distance x this) ticks
edge.bandwidth = 32           # codons per tick on smooth ground (x0.25-1 by ruggedness)
edge.capacity = 2             # cargoes in transit at once, per directed edge

# --- each node (means; vary.* spreads them: value = mean x (1 + f x noise)) ---
world.soup_size = 16384       # codons
world.millicores = 2000
cpu.instr_per_core = 25000    # 50k instructions a tick for a fully held node
vary.soup_size = 0.5
vary.millicores = 0.5
vary.cool = 0.5               # climate: heat.cool, the fraction of heat lost per tick
vary.spark_rate = 0.5         # warm pools
vary.radiation = 0.5          # copy, flaw and rot rates together

# --- Phase 4 features (design.md 6.10): on by default since Phase 10, at these
# values; set any of them here to change it (0 turns it off).
# heat.ambient = 0.05           # the ambient leak
# edge.corruption = 0.0002      # bit flips per codon per tick in transit
# edge.failure = 0.0001         # links failing, per link per tick
# edge.downtime = 1000          #   for this long on average
# world.disk = 4096             # disk codons per node (vary.disk)
# mem.volatility = 0.00001      # wipes per page per tick (vary.volatility)
# salvage.ratio = 4             # a program gets pieces of code more than 4x its genome
# signal.channels = 16          # EMIT / LISTEN (signal.attenuation 0.25, signal.floor 1)
# node.endurance = 1000000000   # codon writes before a node wears out (vary.endurance): the only collapse
# world.land = 0.8              # fraction of sites that are land at once
# world.drift = 0.00001         # how fast the land and property fields drift

# --- Phase 5: the real GPU and NPU (design.md 6.11): on by default since Phase
# 10 (world.gpus 400, world.npus 200, async). `nova devices` lists what the
# machine has; `nova bench devices` times them. The device never changes a
# result, only where the work runs.
# world.gpus = 400              # GPU units per node (and npu: world.npus)
# accel.mode = async            # ops issue during the tick, complete at a later barrier
# accel.latency = 2             #   at the barrier ending tick t + latency - 1
# accel.gpu = auto              # auto (the GPU with the most memory), cpu, or part of a name
# accel.npu = auto              # auto (the NPU if its self-test passes, else the GPU), cpu, gpu
# accel.verify = 0              # check every Nth device batch against the CPU reference
# High-volume profile (the async defaults): gpu.setup 32, gpu.cpu_per_element
# 1/1024, gpu.elements 4096, npu.cpu_per_mac 1/16384, npu.macs 65536.

# --- instruction set ---
isa.table = nova_v2           # codon 0 is INERT, what dead matter decays to (Phase 10)
isa.selectors = nearest

# --- Phase 1b rules (D1, D10) ---
mem.upkeep = 2
cpu.wear = 0.001
spark.timing = last
contact.inject_key = true
contact.inject_room = 1

# --- sparks, per node (the abio node's, scaled to a quarter of its memory) ---
spark.initial = 100
spark.rate = 0.25
spark.grant = 10
spark.min_len = 8
spark.max_len = 64

# --- detection ---
detect.enabled = true
detect.similarity = 0.75
detect.genebank_threshold = 2
detect.inject = true
detect.written = true
detect.gate_depth = 2
detect.gate_alive = 2

# --- run ---
run.ticks = 0                 # no tick limit: run.seconds or Esc stops it
run.seconds = 0
run.after_replicator = -1     # keep going after the first replicator (colonists come later)
run.threads = 0               # all hardware threads
stats.window = 1000
replay.checkpoint_every = 10000
output.csv = runs/world/manual/stats.csv
output.nodes = runs/world/manual/nodes.csv
output.replay = runs/world/manual/replay.log
output.genebank = runs/world/manual/genebank.txt
output.lineages = runs/world/manual/lineages.csv
output.result = runs/world/manual/result.txt
# Phase 6: a final snapshot, and numbered ones (<path>.<tick>) every N ticks,
# for `nova view <snapshot>`. A snapshot of this world is 20-40 MB.
# output.snapshot = runs/world/manual/snap
# output.snapshot_every = 100000
#
# Watching it live: build-release\bin\nova.exe view configs\world.cfg
# Browsing a finished run: build-release\bin\nova.exe view --run runs\world\manual
