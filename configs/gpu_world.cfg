# Nova Phase 8 GPU world (design.md 6.14, docs/phase8-plan.md): the 1,000-node
# landscape of configs\landscape.cfg with warps on -- programs that run on the
# GPU in lockstep lanes -- and its GPU units placed against its CPU: GPU-rich
# regions are CPU-poor, and a third of the nodes have almost no CPU at all.
# Sparks there are born on the GPU (spark.gpu_grant), so life on those nodes
# has to run on warps. warp.device = auto shares each round between the real
# GPU and the CPU, and runs ticks without the GPU when that is quicker; every
# choice gives the very same world.
#
#   build-release\bin\nova.exe run configs\gpu_world.cfg --set run.seconds=300
#   build-release\bin\nova.exe view configs\gpu_world.cfg

seed = 1

# --- the land, as configs\landscape.cfg ---
world.model = soup
world.graph = landscape
world.nodes = 1000
land.aspect = 1.6
land.fraction = 0.3
land.scale = 3.0
land.warp = 0.3
land.border = 0.3
land.resolution = 256
paths.mean = 3.5
paths.spread = 0.5
paths.isolated = 0.01
paths.hubs = 0.02
paths.max = 12
paths.connected = false
paths.long = 0.01
edge.latency_scale = 20
edge.bandwidth = 32
edge.capacity = 2
bridge.count = 2
bridge.isolated = 0
bridge.max_length = 0.25
bridge.latency_scale = 100
bridge.bandwidth = 8
bridge.open_every = 20000
bridge.open_ticks = 1000
bridge.phase = staggered

# --- resources: CPU-poor regions are GPU-rich ---
world.soup_size = 16384
world.millicores = 2000
cpu.instr_per_core = 25000
res.memory.spread = 0.5
res.memory.smooth = 0.6
res.cpu.spread = 0.8
res.cpu.smooth = 0.8
res.cpu.barren = 0.3          # a third of the nodes: (almost) no CPU
world.gpus = 400              # GPU units a node, on average
res.gpu.spread = 0.8
res.gpu.smooth = 0.8
res.gpu.against = cpu         # rich where the CPU is poor
res.gpu.barren = 0.2
vary.cool = 0.5
vary.radiation = 0.5

# --- warps (Phase 8) ---
gpu.warps = true
warp.device = auto            # the GPU and the CPU, timed; gpu = all on the GPU; cpu = the reference
warp.lanes = 32               # lanes a warp
warp.max = 4                  # warps a body may hold
warp.capacity = 256           # warp work a GPU unit gives a tick
warp.step_cost = 16           # work a step
warp.lane_cost = 1            # ... plus this a lane in it
warp.rounds = 1               # GPU rounds a tick
# warp.verify = 100           # check every 100th round against the reference

# --- sparks: on CPU-barren nodes they are born on the GPU ---
spark.initial = 100
spark.rate = 0.25
spark.grant = 10
spark.gpu_grant = 8           # GPU units a spark draws
spark.gpu_born = 0.5          # a spark holding both starts on the GPU this often
spark.min_len = 8
spark.max_len = 64
spark.spread = 0.7
spark.smooth = 0.6
spark.barren = 0.1
spark.hotspots = 3
spark.hotspot_boost = 2

# --- Phase 1b rules ---
isa.table = nova_v2           # codon 0 is INERT, what dead matter decays to (Phase 10)
isa.selectors = nearest
mem.upkeep = 2
cpu.wear = 0.001
spark.timing = last
contact.inject_room = 1

# --- detection ---
detect.enabled = true
detect.similarity = 0.75
detect.genebank_threshold = 2
detect.inject = true
detect.written = true
detect.gate_depth = 2
detect.gate_alive = 2

# --- budgets (Phase 7b), as configs\landscape.cfg ---
# budget.memory = 25%
# budget.gpu = 50%              # (accel.mode = async) also sizes warp.capacity
# budget.threads = all_but_one
# budget.priority = below_normal

# --- run ---
run.ticks = 0
run.seconds = 0
run.after_replicator = -1
run.threads = 0
stats.window = 1000
stats.nodes_every = 10
replay.checkpoint_every = 10000
output.csv = runs/gpu_world/manual/stats.csv
output.nodes = runs/gpu_world/manual/nodes.csv
output.replay = runs/gpu_world/manual/replay.log
output.genebank = runs/gpu_world/manual/genebank.txt
output.lineages = runs/gpu_world/manual/lineages.csv
output.profiles = runs/gpu_world/manual/profiles.csv   # behaviour profiles (A3): nova analyse roles / groups
output.arrivals = runs/gpu_world/manual/arrivals.csv
output.result = runs/gpu_world/manual/result.txt
