# Nova Phase 1a soup world: the interpreter on every node (design.md 6.5).
# Run from the repo root:
#   build\bin\nova.exe run configs\soup.cfg --threads 20
#   build\bin\nova.exe replay runs\soup.replay --threads 1
# The printed hash is the same at every thread count.
#
# Each node starts as random waste with sparks firing, plus the 6.2 sketch
# replicator seeded at codon 2000 (a smoke test: Nova's main mode is unseeded,
# and that is Phase 1b). Delete the seed.* lines for a pure random soup.

seed = 42

# --- structural (fixed for the whole run) ---
world.model = soup
world.nodes = 32
world.chords = 16             # the graph is built but unused until Phase 3
world.soup_size = 16384       # codons per node
world.millicores = 4000       # CPU per node
cpu.instr_per_core = 1000     # instructions per tick for 1000 millicores

isa.table = nova_v1           # or tierra0 (with isa.membrane = open), or custom
isa.membrane = private

spark.initial = 200
spark.grant = 10
spark.min_len = 8
spark.max_len = 64

seed.genome = SENSE ALLOC NOP1 COPY DJNZ NOP0 INC DIVIDE
seed.at = 2000
seed.millicores = 1000

# heat and hazards: the defaults (design.md 6.5) unless set here
heat.enabled = true

# --- live knobs (may change mid-run; logged as replay events) ---
spark.rate = 0.5

# --- run and outputs (empty path = off) ---
run.ticks = 500
run.threads = 0               # 0 = all hardware threads
stats.window = 50
replay.checkpoint_every = 50
output.csv = runs/soup.csv
output.replay = runs/soup.replay
output.snapshot = runs/soup.snap
