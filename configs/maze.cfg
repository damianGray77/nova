# Nova Phase 7 maze (design.md 6.13): the landscape preset as one big, winding
# land with sparse paths -- dead ends, long detours, many hermits -- and life
# that must travel far from a few spark hotspots. Like landscape.cfg: one world of
# 1,000 nodes generated like a game level --
# paths from a triangulation (some nodes with one, hubs with up to 12, a few
# hermits with none), bridges between neighbouring landmasses that open for
# 1,000 ticks in every 20,000, and sparks and resources spread unevenly (rich,
# poor and barren nodes). Nova's Phase 1b rules; every feature on by default (Phase 10).
#
#   build-release\bin\nova.exe run configs\maze.cfg --set run.seconds=300
#   build-release\bin\nova.exe view configs\maze.cfg
# Its siblings: configs\landscape.cfg (continents) and configs\archipelago.cfg.

seed = 1

# --- the land (C1) ---
world.model = soup
world.graph = landscape
world.nodes = 1000
land.aspect = 1.6             # width over height
land.fraction = 0.7           # the share that is land
land.scale = 1.5              # features across the height: higher = more, smaller islands
land.warp = 0.3               # how far coastlines wander
land.border = 0.6             # how strongly the edges sink into the sea
land.resolution = 256         # raster cells across the height

# --- paths (C3), generated once ---
paths.mean = 1.8              # paths a node wants, on average
paths.spread = 0.3            # how unevenly
paths.isolated = 0.03         # hermits: no paths
paths.hubs = 0.01             # hubs: up to paths.max, with roads to their neighbours' neighbours
paths.max = 12
paths.connected = false       # true: each landmass in one piece
paths.long = 0.01             # long links within a landmass, per node
edge.latency_scale = 30       # ticks per unit of length (the world is land.aspect x 1)
edge.bandwidth = 32           # codons per tick on smooth ground
edge.capacity = 2             # cargoes in transit at once, per direction

# --- bridges between landmasses (C4) ---
bridge.count = 2              # per pair of neighbouring landmasses
bridge.isolated = 0           # the fraction of landmasses with none
bridge.max_length = 0.25
bridge.latency_scale = 100
bridge.bandwidth = 8
bridge.open_every = 20000     # open for open_ticks of every open_every ticks
bridge.open_ticks = 1000
bridge.phase = staggered      # together, staggered or random

# --- resources: means per node, spread unevenly (C6) ---
world.soup_size = 16384       # codons (res.memory)
world.millicores = 2000       # (res.cpu)
cpu.instr_per_core = 25000
res.memory.spread = 0.5       # 0 even; higher = richer and poorer nodes
res.memory.smooth = 0.6       # 0 per node; 1 rich and poor regions
res.cpu.spread = 0.6
res.cpu.smooth = 0.5
res.cpu.barren = 0.02         # nodes with (almost) none
vary.cool = 0.5               # climate, varied as before
vary.radiation = 0.5

# --- sparks, spread the same way ---
spark.initial = 100
spark.rate = 0.25                # per node on average (a live knob)
spark.grant = 10
spark.min_len = 8
spark.max_len = 64
spark.spread = 0.7
spark.smooth = 0.6
spark.barren = 0.4            # nodes with no sparks: life arrives by colonising them
spark.hotspots = 6
spark.hotspot_boost = 4

# --- Phase 1b rules ---
isa.table = nova_v2           # codon 0 is INERT, what dead matter decays to (Phase 10)
isa.selectors = nearest
mem.upkeep = 2
cpu.wear = 0.001
spark.timing = last
contact.inject_key = true
contact.inject_room = 1

# --- detection ---
detect.enabled = true
detect.similarity = 0.75
detect.genebank_threshold = 2
detect.inject = true
detect.written = true
detect.gate_depth = 2
detect.gate_alive = 2

# --- budgets (Phase 7b): size the world from the machine instead; each becomes an
# ordinary setting at start-up, recorded in the replay log ---
# budget.memory = 25%           # of the RAM available: replaces world.soup_size
# budget.disk = 20GB            # the disk tier, in files at disk.path (not C:)
# disk.path = E:\nova_disk
# budget.threads = all_but_one  # (the default) or all, a count, a percentage
# budget.priority = below_normal # (the default) or normal, idle

# --- run ---
run.ticks = 0
run.seconds = 0
run.after_replicator = -1
run.threads = 0
stats.window = 1000
stats.nodes_every = 10        # per-node rows every 10 windows (1,000 rows each)
replay.checkpoint_every = 10000
output.csv = runs/maze/manual/stats.csv
output.nodes = runs/maze/manual/nodes.csv
output.replay = runs/maze/manual/replay.log
output.genebank = runs/maze/manual/genebank.txt
output.lineages = runs/maze/manual/lineages.csv
output.profiles = runs/maze/manual/profiles.csv   # behaviour profiles (A3): nova analyse roles / groups
output.arrivals = runs/maze/manual/arrivals.csv
output.result = runs/maze/manual/result.txt
